name: Windows build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: ["claude/hopeful-fermat-h57731"]
    paths:
      - "app/**"
      - "packaging/**"
      - "installer/**"
      - "requirements*.txt"
      - ".github/workflows/windows-build.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Compilar (tests + PyInstaller + autoverificación + instalador)
        run: powershell -ExecutionPolicy Bypass -File packaging\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: TurnosDesktopSetup
          path: installer/Output/TurnosDesktopSetup.exe
