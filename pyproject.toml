[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Datos de trazo SVG: líneas largas por naturaleza, partirlas los rompería.
"app/ui/icons.py" = ["E501"]
"app/ui/theme.py" = ["E501"]  # la hoja de estilos va una regla por línea
"tools/make_icons.py" = ["E501"]
